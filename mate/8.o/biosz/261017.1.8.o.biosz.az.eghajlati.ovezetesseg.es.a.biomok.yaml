Question:
  - Type: singlechoice
    Text: Mit figyelhetünk meg a hasonló éghajlatú területeken?
    A: Az erdők ugyanolyan megjelenésűek
    B: Az élővilág mindenhol teljesen azonos
    C: Csak a csapadék mennyisége azonos
    D: Egyáltalán nincsenek erdők ezeken a tájakon
    Correct: A

  - Type: singlechoice
    Text: Mitől alakulnak ki eltérő éghajlatú területek a Földön?
