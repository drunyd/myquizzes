Quiz: Alkalmazkodás és tűrőképesség
Source: mate_wiki/8.o/biosz/8.o.biosz.alkalmazkodas.es.turokepesseg.html
Question:
  - Type: singlechoice
    Text: Hol képesek megélni és szaporodni az élőlények?
    A: Ahol képesek alkalmazkodni a környezeti feltételekhez, vagy azok számukra kedvezőek
    B: Bárhol, mert mindenhez alkalmazkodnak
    C: Csak a trópusokon
    D: Csak a mérsékelt övezetben
    Correct: A

  - Type: multiplechoice
    Text: Melyek az élettelen környezeti adottságok?
    Answers: [fénymennyiség, hőmérséklet, levegő oxigéntartalma, talaj összetétele]
    Correct: [fénymennyiség, hőmérséklet, levegő oxigéntartalma, talaj összetétele]

  - Type: singlechoice
    Text: Mitől függ a fénymennyiség?
