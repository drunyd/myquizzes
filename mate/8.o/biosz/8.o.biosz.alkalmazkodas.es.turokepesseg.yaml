    B: A talaj színétől
    C: A levegő nedvességétől
    D: A növények magasságától
    Correct: A

  - Type: singlechoice
    Text: Mennyit csökken a hőmérséklet a föld felszínén felfelé haladva?
    A: 100 méterenként 1 °C-ot
