Quiz: A lombhullató erdők élővilága
Source: mate_wiki/8.o/biosz/261017.2.8.o.biosz.a.lombhullato.erdok.elovilaga.html
Question:
  - Type: singlechoice
    Text: Hol jellemző a lombhullató erdők biomja?
    A: Hazánk jelentős részén is
    B: Csak a trópusokon
    C: Csak a sarkkörökön
    D: Kizárólag a trópusi sivatagokban
    Correct: A

  - Type: singlechoice
    Text: Mi váltja ki a lombhullató fák leveleinek őszi lehullását?
    A: A csapadékhiány
    B: A tavaszi fagyok
    C: A nyári hőség
    D: Az erdei állatok rágása
    Correct: A

  - Type: singlechoice
    Text: Mi jellemzi a lombhullató erdők fajszámát?
    A: Fajszegényebb, alig néhány fa alkot egy állományt
    B: Rendkívül fajgazdag, több száz fafaj alkotja a lombkoronát
    C: Csak egyetlen fafaj él benne
    D: Csak cserjék alkotják
    Correct: A

  - Type: singlechoice
    Text: Hány lombkoronaszintje lehet a lombhullató erdőknek?
    A: Egy vagy kettő
    B: Három vagy négy
    C: Öt vagy hat
    D: Nincs lombkoronaszintje
    Correct: A

  - Type: singlechoice
    Text: Miről nevezik el az erdőket?
    A: A többségben előforduló fákról
