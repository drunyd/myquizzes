  - Type: singlechoice
    Text: Mi jellemző a nemesgázokra?
    A: reakcióképesek
    B: mérgezők
    C: stabil atomok
    D: színesek
    Correct: C

  - Type: singlechoice
    Text: Mi a szén-dioxid vegyjele?
    A: CO
    B: C
    C: CO2
    D: O2
    Correct: C

  - Type: singlechoice
    Text: Hogyan viselkedik a szén-dioxid a levegőben?
    A: felfelé száll
    B: alulról tölti ki a teret
    C: eltűnik
    D: robban
    Correct: B

  - Type: singlechoice
    Text: Mit okoz a magas szén-dioxid-tartalom?
    A: oxigéndús levegőt
    B: égést
    C: álmosságot, fulladást
    D: fotoszintézist
    Correct: C

  - Type: singlechoice
    Text: Mi a földgáz legfőbb összetevője?
    A: etán
    B: propán
    C: metán
    D: bután
    Correct: C
