    Correct: [oxigén, oxigéngáz]

  - Type: word
    Text: Melyik anyag zöld színű a hevítés utáni maradékban?
    Answers: [kálium-manganát, kálium-manganát.]
    Correct: [kálium-manganát, kálium-manganát.]

  - Type: word
    Text: Mi az exoterm változás ellentéte?
    Answers: [endoterm]
    Correct: [endoterm]

