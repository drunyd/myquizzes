  - Type: ordering
    Text: Rendezd időrendbe a jelrendszer fejlődésének lépéseit!
    Items:
      - Berzelius javaslata
      - John Dalton rajzos atomjelei
      - A középkori alkimisták misztikus jelei
      - A mai egységes jelrendszer
    Correct:
      - A középkori alkimisták misztikus jelei
      - John Dalton rajzos atomjelei
      - Berzelius javaslata
      - A mai egységes jelrendszer

  - Type: word
    Text: Írd le a víz képletét!
    Answers: [H2O]
    Correct: [H2O]

  - Type: word
    Text: Írd le a szén-dioxid képletét!
    Answers: [CO2]
    Correct: [CO2]

  - Type: word
    Text: Mi a szőlőcukor képlete?
    Answers: [C6H12O6]
    Correct: [C6H12O6]

  - Type: multiplechoice
    Text: Melyek a kémiai jelrendszer előnyei?
    Answers: [gyors jelölés, pontos jelölés, nyelvtől független, csak magyarul használható]
    Correct: [gyors jelölés, pontos jelölés, nyelvtől független]
