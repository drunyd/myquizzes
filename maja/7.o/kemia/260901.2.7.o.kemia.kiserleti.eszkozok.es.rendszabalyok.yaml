Quiz: Kísérleti eszközök és rendszabályok
Source: maja_wiki/7.o/kemia/260901.2.7.o.kemia.kiserleti.eszkozok.es.rendszabalyok.html
Question:
  - Type: singlechoice
    Text: Mi a kísérletezés a kémiában?
    A: A kémia módszere
    B: A kémia egyik terméke
    C: A kémia egyik eszköze
    D: A kémia egyik ásványkincse
    Correct: A

  - Type: singlechoice
    Text: Mik a vegyszerek a forrás szerint?
    A: A laboratóriumban lévő minden anyag
    B: Csak a mérgező anyagok
    C: Csak a folyékony anyagok
    D: Csak a háztartási tisztítószerek és a savak
