  - Type: singlechoice
    Text: Mi jellemző gyakran a vegyszerekre?
    A: Mérgezők és irritálók
    B: Mindig teljesen veszélytelenek
    C: Mindig ehetők és ihatók
    D: Mindig szagtalanok
    Correct: A

  - Type: singlechoice
    Text: Mit nem teszünk a vegyszerekkel?
    A: Nem esszük meg őket
    B: Nem öntjük ki a kijelölt edénybe
    C: Nem jelöljük meg a nevüket
    D: Nem használunk hozzájuk védőfelszerelést
