Quiz: A dualista gazdaság fejlődése
Source: maja_wiki/7.o/tori/2.resz/261024.7.o.tori.a.dualista.gazdasag.fejlodese.html
Question:
  - Type: singlechoice
    Text: Mit teremtett meg a kiegyezés a gazdasági fejlődéshez?
    A: Katonai szövetségeket és hadsereget
    B: Politikai, jogi, társadalmi alapokat
    C: Gyarmatokat és tengeri kikötőket
    D: Új vallási és oktatási intézményeket
    Correct: B

  - Type: singlechoice
    Text: Melyik ágazat indul el elsőként, és lesz a fejlődés húzóágazata?
    A: A bányászat és a kohászat
    B: A gépgyártás és a vegyipar
    C: A mezőgazdaság
    D: A közlekedés és a kereskedelem
    Correct: C

  - Type: singlechoice
    Text: Melyik új növényt említi a forrás a mezőgazdaság fejlődésénél?
    A: A cukorrépa
    B: A rizs és a búza
    C: A kukorica
    D: A burgonya
    Correct: A

  - Type: singlechoice
    Text: Melyik gépet említi a forrás a gépesítés példájaként?
    A: A cséplőgép
    B: Az aratógép és a vetőgép
    C: A gőzeke és a szántógép
    D: A lóvontatta eke
    Correct: A

  - Type: singlechoice
    Text: Melyik iparág épült a mezőgazdaság termékeire?
    A: A textil- és ruházati ipar
    B: Az élelmiszeripar
    C: A bányászat és a kohászat
    D: A hadi- és hajóipar
    Correct: B

  - Type: singlechoice
    Text: Mely közlekedési beruházásokat említi a forrás?
    A: Autópályák és repülőterek építését
    B: Tengeri kikötők és hajóutak építését
    C: Vasút- és csatornaépítést
    D: Hegyi vasutak és alagutak építését
    Correct: C

  - Type: singlechoice
    Text: Mennyi volt a közlekedési hálózat hossza a fejlődés előtt a forrás szerint?
    A: 2120 km
    B: 222 km
    C: 1222 km
    D: 21200 km
    Correct: B

  - Type: singlechoice
    Text: Mire nőtt a közlekedési hálózat hossza a forrás szerint?
    A: 2 120 km
    B: 12 200 km
    C: 212 000 km
    D: 21 200 km
    Correct: D

  - Type: singlechoice
    Text: Melyik tartozik a nehézipar ágai közé a forrás felsorolásában?
    A: A vaskohászat
    B: Az élelmiszeripar
    C: A textilipar
    D: A vegyipar
    Correct: A

  - Type: singlechoice
    Text: Melyik ágazatot említi még a forrás az ipar mellett?
    A: Az erdőgazdálkodás
    B: A bányászat
    C: A halászat
