Quiz: Az állatok és a gombák kialakulása
Source: maja_wiki/7.o/biosz/261108.7.o.biosz.az.allatok.es.a.gombak.kialakulasa.html
Question:
  - Type: singlechoice
    Text: Mi a közös az állatokban és a gombákban a forrás szerint?
    A: a heterotróf anyagcsere
    B: a zöld színtest jelenléte
    C: a helyváltoztatás képessége
    D: a sejtfallal határolt sejt
    Correct: A

  - Type: singlechoice
    Text: Miben különbözik leginkább az állat a gombától?
    A: Az állat gyorsan helyet változtathat
    B: Az állat sejtjei mindig kerekszerűek
    C: Az állatnak nincs sejtplazmája
    D: Az állat a tápanyagát fotoszintézissel állítja elő
    Correct: A

  - Type: singlechoice
    Text: Mi határolja az állati sejtet?
    A: a sejtfal
    B: a sejthártya
    C: a sejtmaghártya
    D: a gombafonal
    Correct: B

  - Type: singlechoice
    Text: Milyen tulajdonságú az állati sejt sejthártyája?
    A: féligáteresztő
    B: teljesen átjárhatatlan
    C: fényt áteresztő
    D: szaruanyagú
    Correct: A

  - Type: singlechoice
    Text: Van-e sejtfala az állati sejtnek?
    A: van, vékony sejtfala
    B: nincs, csak sejthártyája
    C: csak a bőrsejteknek van
    D: csak az idegsejteknek van
    Correct: B

  - Type: singlechoice
    Text: Mi tölti ki az állati sejt belsejét?
    A: sejtplazma
    B: kovaanyag
    C: sejtüreg
    D: zöld színtest
    Correct: A

  - Type: singlechoice
    Text: Mi határolja az állati sejt sejtmagját?
    A: a sejtfal és a sejthártya együtt
    B: a sejtmaghártya
    C: a sejthártya
    D: a gombafonal
    Correct: B

  - Type: singlechoice
    Text: Melyik sejtalkotó NINCS az állati sejtben?
    A: a zöld színtest
    B: a sejtplazmában lévő sejtmag
    C: a mitokondriumok sokasága
    D: a sejthártya
    Correct: A

  - Type: singlechoice
    Text: Mely anyagot NEM tartalmazza az állati sejt a forrás szerint?
    A: sejtüregeket
    B: sejtplazmát
    C: sejtmagot
    D: mitokondriumot
    Correct: A

  - Type: singlechoice
    Text: Hogyan viszonyul az állati sejt mérete a növényi sejtéhez?
    A: megegyezik vele
    B: sokkal nagyobb nála
    C: fele akkora nála
    D: attól függ, hol van
    Correct: A

  - Type: singlechoice
    Text: Mitől függ az állati sejtben a mitokondriumok száma?
    A: a sejt működésétől
    B: a sejtben lévő sejtmag alakjától
    C: a sejt alakjától
    D: a sejt korától
    Correct: A

  - Type: singlechoice
    Text: Milyen alakú az izomsejt a forrás szerint?
    A: hegyes
    B: kerek
    C: gömbölyű
    D: lapos
    Correct: A

  - Type: singlechoice
    Text: Melyik sejtre jellemző a nyúlványos alak?
    A: az idegsejtre
    B: a vérsejtre
    C: az izomsejtre
    D: a bőrsejtre
    Correct: A

  - Type: singlechoice
    Text: Hol találhatók kerek alakú állati sejtek a forrás példája szerint?
    A: a vérben
    B: a bőrben
    C: az idegekben
    D: az izmokban
    Correct: A

  - Type: singlechoice
    Text: Mely szerv sejtjeire jellemző a vékony és vaskos alak?
    A: a bőr
    B: a vér
    C: az idegrendszer
    D: az izomzat
    Correct: A

  - Type: singlechoice
    Text: Miből indulhatott ki a mai állatvilág kialakulása?
    A: heterotróf egysejtűekből
    B: fotoszintetizáló sejtekből
    C: gombafonalakból
    D: növényi szövetekből
    Correct: A

  - Type: singlechoice
    Text: Milyen felépítésűek voltak az állatok első képviselői?
    A: sejthalmazos felépítésűek
    B: szövetes felépítésűek
    C: szervrendszeres felépítésűek
    D: egyszerű sejtfalúak
