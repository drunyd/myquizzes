  - Type: singlechoice
    Text: Mi alakult ki az állatvilágban a forrás szerint?
    A: az ivarsejtekkel történő szaporodás
    B: a spórákkal történő ivartalan szaporodás
    C: a sejtfalon belüli osztódás
    D: a fotoszintézis
    Correct: A

  - Type: singlechoice
    Text: Hányadik önálló csoportja a gombák az élővilágnak?
    A: a harmadik
    B: a második
    C: az első
    D: a negyedik
    Correct: A

  - Type: singlechoice
    Text: Miből épülnek fel a fejlettebb gombák?
