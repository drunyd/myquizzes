  - Type: singlechoice
    Text: Milyen szerveződésűek a szivacsok?
    A: álszövetes szerveződésűek
    B: valódi szövetekkel rendelkező állatok
    C: egysejtűek
    D: sejtmag nélküliek
    Correct: A

  - Type: singlechoice
    Text: Hány sejtsorból áll a szivacsok kehelyszerű teste?
    A: kettőből
    B: egyből
    C: háromból
    D: négyből
    Correct: A

  - Type: singlechoice
    Text: Miért nem tudja helyét változtatni a szivacs?
    A: Mert a kehely az aljzathoz rögzül
    B: Mert a sejtjeiben nincsenek mitokondriumok
    C: Mert nincs sejtmagja
    D: Mert spórákkal szaporodik
    Correct: A

  - Type: singlechoice
    Text: Mit termelnek a szivacs külső rétegének sejtjei?
    A: kova vagy szaru anyagot
    B: zöld színtestet
    C: sejtfalat és sejtplazmát
    D: ivarsejteket és spórákat
