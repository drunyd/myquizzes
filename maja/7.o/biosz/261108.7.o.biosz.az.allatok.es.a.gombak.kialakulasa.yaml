    Correct: [kerek, hegyes, nyúlványos]

  - Type: multiplechoice
    Text: Mely állítások igazak a szivacsokra?
    Answers: [álszövetesek, kehelyszerű testük van, két sejtsorból állnak, valódi szöveteik vannak]
    Correct: [álszövetesek, kehelyszerű testük van, két sejtsorból állnak]

  - Type: multiplechoice
    Text: Mely állatcsoportokat említi a forrás a szövetes állatok példájaként?
