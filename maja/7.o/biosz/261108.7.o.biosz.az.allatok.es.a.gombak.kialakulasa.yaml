  - Type: singlechoice
    Text: Hogyan táplálkozik a szivacs a forrás szerint?
    A: A belső sejtsor nyúlványai kiszűrik a táplálékot
    B: A külső sejtek kovaanyagot emésztenek
    C: A kehely alján sejtüregek gyűjtik össze a lebegő táplálékot
    D: Fotoszintézissel állítja elő a tápanyagot
