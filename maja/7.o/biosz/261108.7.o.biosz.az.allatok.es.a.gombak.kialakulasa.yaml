  - Type: multiplechoice
    Text: Mely állítások igazak a mai állatvilág kialakulására?
    Answers: [heterotróf egysejtűekből indulhatott, az első képviselők sejthalmazosak, később szövetes állatok jelentek meg, az első állatok már szövetesek]
    Correct: [heterotróf egysejtűekből indulhatott, az első képviselők sejthalmazosak, később szövetes állatok jelentek meg]

  - Type: multiplechoice
    Text: Mely állítások igazak az állati sejtre a forrás szerint?
    Answers: [nincs sejtfala, nincs zöld színteste, mérete a növényi sejtével egyezik, sejtüregeket tartalmaz]
