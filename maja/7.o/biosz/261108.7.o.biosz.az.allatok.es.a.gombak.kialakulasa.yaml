  - Type: singlechoice
    Text: Hogyan jut be a víz a szivacs belsejébe?
    A: apró lyukakon keresztül
    B: a kelyhe peremén kialakult nyílásokon át
    C: a sejtmaghártyán át
    D: a gombafonalakon át
