  - Type: multiplechoice
    Text: Mi jellemzi a növények anyagcseréjét?
    Answers: [napfény energiáját használja, szén-dioxidot használ, vízből építkezik, oxigént bocsát ki]
    Correct: [napfény energiáját használja, szén-dioxidot használ, vízből építkezik, oxigént bocsát ki]

  - Type: word
    Text: Hogyan nevezzük a növények anyagcseréjét?
