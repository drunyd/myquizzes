  - Type: ordering
    Text: Rendezd sorrendbe az első anyagcseretípus folyamatának lépéseit!
    Items:
      - Cukor keletkezése
      - Oxigén leadása a környezetbe
      - Szén-dioxid és víz felvétele
      - Napenergia felhasználása
    Correct:
      - Szén-dioxid és víz felvétele
      - Napenergia felhasználása
      - Cukor keletkezése
      - Oxigén leadása a környezetbe
