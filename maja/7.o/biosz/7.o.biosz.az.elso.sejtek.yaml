  - Type: singlechoice
    Text: Mi a sejtfal szerepe?
    A: Védi a sejtet
    B: Nagyítja a sejtet
    C: Mozgatja a sejtet
    D: Táplálja a sejtet
    Correct: A

  - Type: singlechoice
    Text: Mi lehet még a sejtfal mellett?
    A: Nyálkás burok
    B: Második sejtmag
    C: Klorofill
    D: Csilló
