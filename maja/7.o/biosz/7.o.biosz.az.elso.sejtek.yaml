    Correct: [sejtplazma]

  - Type: multiplechoice
    Text: Milyen tulajdonságai vannak a sejtplazmának?
    Answers: [nagy víztartalmú, kocsonyás, összetett vegyületeket tartalmaz]
    Correct: [nagy víztartalmú, kocsonyás, összetett vegyületeket tartalmaz]

  - Type: singlechoice
    Text: Ki állítja elő a sejtplazma összetett vegyületeit?
