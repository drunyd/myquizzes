Quiz: Az első sejtek
Question:
  - Type: singlechoice
    Text: Milyen volt az első élőlények felépítése?
    A: Nagyon egyszerű
    B: Nagyon bonyolult
    C: Több sejtből álló
    D: Sejt nélküli
    Correct: A

  - Type: singlechoice
    Text: Mely mai élőlények hasonlítanak legjobban az első élőlényekhez?
    A: A baktériumok
    B: A gombák
    C: A növények
    D: Az állatok
    Correct: A

  - Type: singlechoice
    Text: Hány sejtből áll a baktérium?
    A: Egyetlen sejtből
    B: Két sejtből
    C: Sok sejtből
    D: Sejtmagból
    Correct: A

  - Type: word
    Text: Mi határolja a baktériumot?
    Answers: [sejthártya]
    Correct: [sejthártya]

  - Type: singlechoice
    Text: Mit termel a sejthártya kifelé?
    A: Sejtfalat
    B: Sejtplazmát
    C: DNS-t
    D: Fehérjét
