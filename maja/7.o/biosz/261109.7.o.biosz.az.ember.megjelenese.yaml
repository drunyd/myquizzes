Quiz: Az ember megjelenése
Source: maja_wiki/7.o/biosz/261109.7.o.biosz.az.ember.megjelenese.html
Question:
  - Type: singlechoice
    Text: Mikor vált el az ember törzsfejlődése a mai emberszabású majmokétól?
    A: 25 millió évvel ezelőtt
    B: 2,5 millió évvel ezelőtt
    C: 250 millió évvel ezelőtt
    D: 25 ezer évvel ezelőtt
    Correct: A

  - Type: singlechoice
    Text: Melyik lehetett az ember és a majmok közös őse a forrás szerint?
    A: a tölgymajom
    B: a neander-völgyi ember
    C: az ügyes ember
    D: a felegyenesedett ember
    Correct: A

  - Type: singlechoice
    Text: Mekkora lehetett a tölgymajom tömege?
    A: 20&ndash;45 kg
    B: 2&ndash;4,5 kg
    C: 120&ndash;145 kg
    D: 200&ndash;450 kg
    Correct: A

  - Type: singlechoice
    Text: Mekkora volt a tölgymajom agyának térfogata?
    A: 300 cm&sup3;
    B: 500 cm&sup3;
    C: 800 cm&sup3;
    D: 1300 cm&sup3;
    Correct: A

  - Type: singlechoice
    Text: Milyen volt a tölgymajom fogíve?
